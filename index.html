<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/lib/bootstrap.min.css">  
  <link rel="stylesheet" href="src/css/index.css">  
  <title>Word Search</title>
</head>
<body>
  <!--<div class="container d-flex flex-column align-items-center">-->
  <div class="container text-center">
    <div class="row text-start">
      <div class="col" id="title-column">  
        <h3>Word Search</h3>
      </div>
    </div>
    <div class="row">
      <div class="col" id="square-frame-column"> 
        <section id="square-frame"></section>
      </div>
    </div>
    <div class="row ms-4">
      <div class="col"> 
        <section id="section-word-list"></section>
      </div>
    </div>
  </div>
  <div id="overlay" class="hidden"></div>
  <div id="loading-text" class="hidden">Loading...</div>

  <button class="btn btn-outline-secondary btn-sm" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight" aria-controls="offcanvasRight">Game settings</button>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel" data-bs-theme="dark">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="offcanvasRightLabel">Settings</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      ...
    </div>
  </div>

  <script type="module" src="src/js/index.js"></script>
</body>
</html>
