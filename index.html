<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="src/lib/bootstrap.min.css">  
  <link rel="stylesheet" href="src/css/index.css">  
  <title>Word Search</title>
</head>
<body>
  <nav class="navbar bg-body-tertiary fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><!--Word Search--></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
        <!--<span class="navbar-toggler-icon"></span>-->
        <i class="bi bi-gear-fill"></i>
      </button>
      <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Game Settings</h5>
          <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
          <form id="form-setting">
            <div class="row align-items-center">
              <div class="col-9">
                <label for="range-word-count" class="form-label">No. of words to search:</label>
                <input type="range" class="form-range" min="3" max="9" id="range-word-count">
              </div>
              <div class="col mt-4">
                <input type="text" readonly class="form-control-plaintext" id="label-word-count" value="00">
              </div>
            </div>

            <div class="row align-items-center mt-3">
              <div class="col-9">
                <label for="range-max-length" class="form-label">Words' max length:</label>
                <input type="range" class="form-range" min="3" max="9" id="range-max-length">
              </div>
              <div class="col mt-4">
                <input type="text" readonly class="form-control-plaintext" id="label-max-length" value="00">
              </div>
            </div>

            <div class="row align-items-center mt-3">
              <div class="col-9">
                <label for="range-timer" class="form-label">Timer:</label>
                <input type="range" class="form-range" min="0" max="9" id="range-timer">
              </div>
              <div class="col mt-4">
                <input type="text" readonly class="form-control-plaintext" id="label-timer" value="00">
              </div>
            </div>
            <div class="row justify-content-center mt-3">
              <div class="col-auto">
                <button type="button" class="btn btn-primary" id="btn-reload">Reload Game</button>
              </div>
            </div>
          </form>
      </div>
    </div>
  </nav>

  <div class="d-flex p-2 justify-content-between flex-row" id="title-row">
    <div><h3 class="title">Word Search</h3></div>
    <div id="timer-container">
      <div class="d-flex flex-row align-items-center">
        <div class="pe-2"><i class="bi bi-stopwatch-fill"></i></div>
        <div id="timer">0:00</div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center" id="square-frame-row">
    <section id="square-frame"></section>
  </div>

  <div class="d-flex p-2 justify-content-center" id="word-list-row">
    <section id="section-word-list"></section>
  </div>
  
  <!--Game Interactive Elements-->
  <div id="overlay" class="invisible"></div>
  <div id="loading-div">
    <div class="spinner-grow" role="status">
      <span class="invisible">Loading...</span>
    </div>
  </div>
  <div id="restart-div" class="invisible">
    <button type="button" class="btn btn-success">Restart Game</button>
  </div>

  <script type="module" src="src/js/index.js"></script>
</body>
</html>
